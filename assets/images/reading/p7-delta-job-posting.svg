<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Delta Supply Logistics Coordinator Job Posting</title>
  <desc id="desc">A clean job posting flyer for Delta Supply Ltd. highlighting a logistics coordinator opening, advanced Excel skills, and a June 30 application deadline.</desc>
  <rect width="720" height="460" fill="#f7f9fc"/>
  <rect x="48" y="38" width="624" height="384" rx="18" fill="#ffffff" stroke="#c9d4e5" stroke-width="2"/>
  <rect x="48" y="38" width="624" height="86" rx="18" fill="#1f5f8b"/>
  <path d="M48 106h624v22H48z" fill="#1f5f8b"/>
  <text x="82" y="80" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">DELTA SUPPLY LTD.</text>
  <text x="82" y="110" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">Hiring Notice</text>
  <text x="82" y="166" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16324f">Logistics Coordinator</text>
  <rect x="82" y="195" width="255" height="46" rx="8" fill="#e8f2fb"/>
  <text x="102" y="224" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f5f8b">Taipei Operations Team</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#24364b">
    <text x="82" y="280">• Track shipments and delivery schedules</text>
    <text x="82" y="318">• Prepare logistics reports for managers</text>
    <text x="82" y="356">• Advanced Excel skills required</text>
  </g>
  <rect x="420" y="194" width="190" height="150" rx="12" fill="#f2f6fb" stroke="#d5dfec"/>
  <text x="444" y="229" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16324f">Apply by</text>
  <text x="444" y="272" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#b45309">June 30</text>
  <line x1="444" y1="292" x2="586" y2="292" stroke="#cbd5e1" stroke-width="2"/>
  <text x="444" y="324" font-family="Arial, sans-serif" font-size="15" fill="#475569">hr@deltasupply.com</text>
  <rect x="82" y="384" width="528" height="1" fill="#d8e1ee"/>
  <text x="82" y="407" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Send a resume and cover letter before the deadline.</text>
</svg>
