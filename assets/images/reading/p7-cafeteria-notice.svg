<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Level 2 Cafeteria Service Update</title>
  <desc id="desc">A clean cafeteria notice showing limited menu hours, Thursday kitchen maintenance, and longer wait times.</desc>
  <rect width="800" height="500" fill="#f3f6fb"/>
  <rect x="80" y="45" width="640" height="410" rx="18" fill="#ffffff" stroke="#b7c3d0" stroke-width="3"/>
  <rect x="80" y="45" width="640" height="92" rx="18" fill="#1f5f8b"/>
  <rect x="80" y="112" width="640" height="25" fill="#1f5f8b"/>
  <text x="115" y="88" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Level 2 Cafeteria</text>
  <text x="115" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dceeff">Service Update</text>

  <rect x="115" y="165" width="250" height="78" rx="12" fill="#eaf3fb" stroke="#b7c3d0" stroke-width="2"/>
  <text x="140" y="198" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#24364b">Limited Menu</text>
  <text x="140" y="225" font-family="Arial, sans-serif" font-size="19" fill="#516175">Thursday</text>

  <rect x="435" y="165" width="250" height="78" rx="12" fill="#fff4dc" stroke="#dfb760" stroke-width="2"/>
  <circle cx="467" cy="204" r="18" fill="#df8b2f"/>
  <path d="M467 190 L467 208 M467 217 L467 218" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="495" y="199" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b4422">Kitchen</text>
  <text x="495" y="225" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b4422">Maintenance</text>

  <line x1="115" y1="275" x2="685" y2="275" stroke="#d7e0ea" stroke-width="3"/>
  <text x="120" y="315" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#24364b">11:30 a.m. to 1:30 p.m.</text>
  <rect x="120" y="340" width="560" height="58" rx="10" fill="#f7faff" stroke="#d7e0ea"/>
  <circle cx="150" cy="369" r="9" fill="#1f5f8b"/>
  <text x="172" y="376" font-family="Arial, sans-serif" font-size="22" fill="#24364b">Please expect longer wait times during lunch service.</text>
  <line x1="120" y1="424" x2="520" y2="424" stroke="#c8d4df" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="444" x2="430" y2="444" stroke="#c8d4df" stroke-width="8" stroke-linecap="round"/>
</svg>
